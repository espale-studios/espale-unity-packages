name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Packages/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "Packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time. Don't cancel a running deployment.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCFX_VERSION: "2.81.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install DocFX
        run: dotnet tool install -g docfx --version "$DOCFX_VERSION"

      # The packages are compiled without the Unity assemblies, so DocFX reports
      # missing-reference compiler errors (allowed in docfx.json). Only DocFX's own
      # warnings, like broken links, are shown here.
      - name: Build docs
        run: docfx docs/docfx.json 2>&1 | grep -v -E "(error|warning) CS[0-9]+"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
